.layout>.hero,.layout>.side,.layout>.board,.layout>.people{animation:board-appear .42s cubic-bezier(.2,.7,.2,1) both}

.modal[open]{animation:dialog-appear .22s ease-out both}.praise{animation:sticker-appear .36s ease-out both}

const $=id=>document.getElementById(id),KEY='family-dashboard-v1',META='family-village-v2',VERSION=document.querySelector('meta[name=app-version]').content;let data,meta;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.tasks))data={tasks:[],day:''};try{meta=JSON.parse(localStorage.getItem(META))||{}}catch{meta={}}if(!Array.isArray(meta.events))meta.events=[];let family='전체',nightUntil=0,wakeLock=null,timerId=null,timerEnd=0;function save(){try{localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(META,JSON.stringify(meta));return true}catch(e){$('status').textContent='저장할 수 없어요. 기기의 저장 공간을 확인해 주세요.';return false}}function dayKey(d){let n=new Date(d.getTime()-7*3600000);return [n.getFullYear(),n.getMonth()+1,n.getDate()].join('-')}function reset(d){const key=dayKey(d);if(data.day!==key){if(data.day)data.tasks.forEach(t=>{if(t.repeat!=='once')t.done=false});data.day=key;save()}}function due(t,d=new Date()){const shifted=new Date(d.getTime()-7*3600000),day=shifted.getDay();if(t.repeat==='weekdays')return day>0&&day<6;if(t.repeat==='weekends')return day===0||day===6;if(t.repeat==='custom')return Array.isArray(t.days)&&t.days.includes(day);return true}function owner(t){return t.owner||'가족'}function esc(s){let el=document.createElement('span');el.textContent=String(s??'');return el.innerHTML}function visibleTasks(who){return data.tasks.filter(t=>due(t)&&(who==='전체'||owner(t)===who))}function render(){renderBoard();for(const who of ['우양이','이안이','가족']){let ts=visibleTasks(who);let left=ts.filter(t=>!t.done).length;$('count-'+who).textContent=ts.length?(left?'할 일 '+left+'개 남음':'오늘 할 일 완료!'):'오늘 할 일이 없어요'}let n=visibleTasks('전체').filter(t=>t.done).length;$('gardenText').textContent=n?'오늘 가족이 '+n+'가지 일을 해냈어요':'오늘도 우리 마을에서 함께해요';$('message').textContent=localStorage.getItem('family-memo')||'오늘도 서로에게 다정하게';}function show(title,html){$('modalTitle').textContent=title;$('modalContent').innerHTML=html;if(!$('modal').open)$('modal').s et tasks=visibleTasks(who);if(tasks.length&&tasks.every(t=>t.done)){let badge=document.createElement('div');badge.className='praise';badge.setAttribute('role','status');badge.innerHTML='<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="#f5c96d"/><path d="m20 8 3.5 7.5 8 .8-6 5.8 1.5 8.2-7-4-7 4 1.5-8.2-6-5.8 8-.8z" fill="#fff8dc"/></svg><span>오늘 할 일을 모두 해냈어요!</span>';document.getElementById('quick-'+who).append(badge)}}document.querySelectorAll('[data-quick]').forEach(b=>b.onchange=()=>{data.tasks[+b.dataset.quick].done=b.checked;save();render()})} $('prevMonth').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()-1);renderBoard()};$('nextMonth').onclick=()=>{monthCursor.setMonth(monthCursor.getMonth()+1);renderBoard()};$('boardSchedule').onclick=()=>schedule();$('manageTasks').onclick=()=>taskView('전체');
function schedule(){let events=[...meta.events].sort((a,b)=>a.date.localeCompare(b.date));show('가족 일정',`<div class="tasks">${events.map(e=>`<div class="task"><span style="flex:1;font-size:19px">${esc(e.date)} · ${esc(e.text)}</span><button data-event="${esc(e.id)}">삭제</button></div>`).join('')||'<div class="empty">등록된 일정이 없어요.</div>'}</div><form id="eventForm" class="formgrid"><input name="date" type="date" required aria-label="날짜"><input name="text" type="text" maxlength="60" required placeholder="일정 이름"><button class="primary wide">일정 추가</button></form>`);document.querySelectorAll('[data-event]').forEach(b=>b.onclick=()=>{if(confirm('이 일정을 삭제할까요?')){meta.events=meta.events.filter(e=>e.id!==b.dataset.event);save();render();schedule()}});$('eventForm').onsubmit=e=>{e.preventDefault();let f=e.currentTarget,txt=f.text.value.trim();if(!txt)return;meta.events.push({id:String(Date.now())+Math.random(),date:f.date.value,text:txt});save();render();schedule()}}$('scheduleBtn').onclick=schedule;

function settings(){show('마을 설정',`<div class="settings"><label><input id="nightEnabled" type="checkbox" ${localStorage.getItem('family-night-enabled')==='true'?'checked':''}> 야간에 화면을 검게 하기</label><label>시작 <input id="nightStart" type="time" value="${esc(meta.nightStart||'22:00')}"> 종료 <input id="nightEnd" type="time" value="${esc(meta.nightEnd||'07:00')}"></label><p class="muted">야간 화면을 켜면 30초 후부터 적용됩니다. 검은 화면을 터치하면 잠시 볼 수 있어요.</p><div class="actionrow"><button class="primary" id="saveSettings">설정 저장</button><button class="smallbtn" id="backup">백업하기</button><button class="smallbtn" id="restore">복원하기</button><input type="file" id="file" accept="application/json" hidden></div><p class="version">현재 버전 ${esc(VERSION)} · 할 일과 메모는 이 기기에 저장됩니다.</p></div>`);$('saveSettings').onclick=()=>{localStorage.setItem('family-night-enabled',$('nightEnabled').checked?'true':'false');meta.nightStart=$('nightStart').value||'22:00';meta.nightEnd=$('nightEnd').value||'07:00';nightUntil=Date.now()+30000;save();$('modal').close();tick()};$('backup').onclick=()=>{let b=new Blob([JSON.stringify({version:2,data,meta,memo:localStorage.getItem('family-memo')||'',night:localStorage.getItem('family-night-enabled')},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='family-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!v.data||!Array.isArray(v.data.tasks)||!v.data.tasks.every(t=>typeof t.text==='string'&&typeof t.done==='boolean'))throw Error();if(confirm('현재 할 일과 메모를 백업 내용으로 바꿀까요?')){data=v.data;meta=v.meta||{};if(!Array.isArray(meta.events))meta.events=[];localStorage.setItem('family-memo',String(v.memo||''));if(v.night) localStorage.setItem('family-night-enabled',v.night);save();tick();render();settings()}}catch{alert('올바른 백업 파일이 아니에요.')}e.target.value=''}}$('settingsBtn').onclick=settings;
function nightNow(d){if(localStorage.getItem('family-night-enabled')!=='true')return false;let parse=x=>{let [h,m]=x.split(':').map(Number);return h*60+m};let start=parse(meta.nightStart||'22:00'),end=parse(meta.nightEnd||'07:00'),now=d.getHours()*60+d.getMinutes();return start===end?false:start<end?now>=start&&now<end:now>=start||now<end}function tick(){let d=new Date();$('clock').textContent=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);$('date').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);$('greeting').textContent=d.getHours()<12?'좋은 아침이에요':d.getHours()<18?'오늘도 함께하는 하루':'오늘 하루도 수고했어요';document.body.classList.toggle('asleep',nightNow(d)&&Date.now()>nightUntil);let old=data.day;reset(d);if(old!==data.day)render()}$('night').onclick=()=>{nightUntil=Date.now()+30000;tick()};async function wake(){if(!('wakeLock'in navigator)){$('status').textContent='화면 꺼짐 방지를 지원하지 않는 브라우저예요.';return}try{wakeLock=await navigator.wakeLock.request('screen');$('status').textContent='화면 꺼짐 방지 켜짐 · 데이터는 이 기기에 저장돼요';wakeLock.addEventListener('release',()=>{$('status').textContent='화면 꺼짐 방지가 해제됐어요.'})}catch{$('status').textContent='화면 꺼짐 방지를 켜지 못했어요. 화면을 터치해 주세요.'}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();wake();weather();checkUpdate(false)}});document.addEventListener('pointerdown',()=>{if(!wakeLock||wakeLock.released)wake()});
function condition(c){if(c===0)return '맑음';if(c<=3)return '구름 조금';if(c<=48)return '안개';if(c<=57)return '이슬비';if(c<=67)return '비';if(c<=77)return '눈';if(c<=82)return '소나기';if(c<=86)return '눈 소나기';if(c>=95)return '천둥번개';return '날씨 확인'}function displayWeather(w,when,stale=false){$('weather').innerHTML=w.time.slice(0,2).map((_,i)=>`<div class="weatherday"><strong>${i?'내일':'오늘'} · ${esc(condition(w.weather_code[i]))}</strong><p>${Math.round(w.temperature_2m_min[i])}° / ${Math.round(w.temperature_2m_max[i])}°</p><small>강수 확률 ${w.precipitation_probability_max[i]??'—'}%</small></div>`).join('');$('weatherStatus').textContent=(stale?'마지막 저장 날씨 · ':'Open-Meteo · ')+when}async function weather(){try{let r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=36.48&longitude=127.25&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2');if(!r.ok)throw Error();let w=(await r.json()).daily;if(!w||!w.time||w.time.length<2)throw Error();let when=new Date().toLocaleString('ko-KR');meta.weather={w,when};save();displayWeather(w,when)}catch{if(meta.weather)displayWeather(meta.weather.w,meta.weather.when,true);else $('weatherStatus').textContent='날씨를 가져오지 못했어요. 인터넷을 확인해 주세요.'}}$('weatherRefresh').onclick=weather;
let availableUpdate=false;async function checkUpdate(manual){try{let url=new URL(location.href);url.searchParams.set('_check',Date.now());let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error();let doc=new DOMParser().parseFromString(await r.text(),'text/html'),v=doc.querySelector('meta[name="app-version"]')?.content;if(!v)throw Error();if(v!==VERSION){availableUpdate=true;$('updateBtn').textContent='새 버전 적용하기';if(manual)alert('새 버전이 있어요. 버튼을 한 번 더 눌러 적용해 주세요.')}else if(manual)alert('현재 최신 버전이에요.')}catch{if(manual)alert('인터넷 연결 후 다시 확인해 주세요.')}}$('updateBtn').onclick=()=>{if(availableUpdate){let u=new URL(location.href);u.searchParams.set('_v',Date.now());location.replace(u)}else checkUpdate(true)};
let activeView='home';
function setView(view){activeView=view;$('homeView').hidden=view!=='home';$('extraView').hidden=view==='home';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('selected',b.dataset.view===view));if(view!=='home')renderExtra();window.scrollTo(0,0)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
function pictogram(text){let t=text.toLowerCase();if(/양치|세수/.test(t))return '<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="25" y="12" width="12" height="49" rx="5" fill="#69b9b1"/><path d="M25 15h12v12H25z" fill="#fff"/><path d="M23 15h16M23 20h16" stroke="#65aeb2" stroke-width="2"/><path d="M45 38h22l-3 26H48z" fill="#7bbdd4"/><path d="M49 44h14" stroke="#fff" stroke-width="3"/></svg>';if(/밥|아침|식사/.test(t))return '<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M12 40h56c-2 16-12 23-28 23S14 56 12 40" fill="#e5a886"/><ellipse cx="40" cy="39" rx="28" ry="6" fill="#fff"/><path d="M30 28q-5-6 0-12m11 12q-5-6 0-12m10 12q-5-6 0-12" fill="none" stroke="#bb8e7b" stroke-width="3" stroke-linecap="round"/></svg>';if(/가방|준비물/.test(t))return '<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="19" y="22" width="42" height="48" rx="12" fill="#79a9cf"/><path d="M30 24v-5a10 10 0 0 1 20 0v5" fill="none" stroke="#547f9e" stroke-width="5"/><rect x="27" y="47" width="26" height="15" rx="5" fill="#d6ebf4"/></svg>';if(/옷|입기/.test(t))return '<svg viewBox="0 0 80 80" aria-hidden="true"><path d="M25 16 12 25l8 13 7-4v33h26V34l7 4 8-13-13-9-8-3q-7 12-14 0z" fill="#e7a597"/><path d="M33 13q7 12 14 0" fill="none" stroke="#fff2dc" stroke-width="4"/></svg>';return '<svg viewBox="0 0 80 80" aria-hidden="true"><rect x="17" y="13" width="46" height="56" rx="8" fill="#81bba9"/><rect x="24" y="20" width="32" height="42" rx="3" fill="#fff"/><path d="m30 42 7 7 14-17" fill="none" stroke="#5ba993" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function renderExtra(){let root=$('extraView');if(activeView==='study'){let day=new Date(Date.now()-7*3600000).getDay(),days=['월','화','수','목','금','토','일'],nums=[1,2,3,4,5,6,0];function isDue(t,n){if(t.repeat==='once')return n===day&&!t.done;if(t.repeat==='weekdays')return n>0&&n<6;if(t.repeat==='weekends')return n===0||n===6;if(t.repeat==='custom')return Array.isArray(t.days)&&t.days.includes(n);return true}let cells='<div class="week-head"></div>'+days.map((x,i)=>'<div class="week-cell week-head '+(nums[i]===day?'today':'')+'">'+x+'</div>').join('');for(const who of ['우양이','이안이']){cells+='<div class="week-cell"><strong>'+who+'</strong></div>';for(const n of nums){let ts=data.tasks.filter(t=>owner(t)===who&&isDue(t,n));cells+='<div class="week-cell '+(n===day?'today':'')+'">'+(ts.map(t=>'<span class="week-chip">'+esc(t.text)+'</span>').join('')||'<span class="muted">등록된 일 없음</span>')+'</div>'}}root.innerHTML='<section class="week-panel"><h2>우리 아이들 주간 시간표</h2><p class="muted">할 일의 반복 요일을 기준으로 보여줘요. 한 번만 하는 일은 오늘에 표시됩니다.</p><div class="week-scroll"><div class="week-grid">'+cells+'</div></div><div class="routine-actions"><button class="smallbtn" id="weekManage">할 일 관리</button></div></section>';document.getElementById('weekManage').onclick=()=>taskView('전체');return}
let who=activeView,items=data.tasks.map((t,i)=>({t,i})).filter(x=>owner(x.t)===who&&due(x.t)),done=items.filter(x=>x.t.done).length,percent=items.length?Math.round(done/items.length*100):0,deadline=meta['depart_'+who]||'',timeText='출발 시간을 설정해 주세요';if(deadline){let [h,m]=deadline.split(':').map(Number),target=new Date();target.setHours(h,m,0,0);let mins=Math.ceil((target-Date.now())/60000);timeText=mins>0?mins+'분 남았어요':'출발 시간이 지났어요'}let cards=items.map(({t,i},idx)=>'<button class="routine-card '+(t.done?'done':'')+'" data-routine="'+i+'" aria-pressed="'+!!t.done+'"><div class="art">'+pictogram(t.text)+'</div><div class="cardtext">'+(idx+1)+'. '+esc(t.text)+'<small>'+(t.done?'완료했어요':'눌러서 완료하기')+'</small></div></button>').join('');root.innerHTML='<section class="routine-top"><div class="routine-title"><h1>'+esc(who)+'의 오늘</h1><p>내 속도로 하나씩 해볼까요?</p></div><div class="routine-time" id="remaining">'+esc(timeText)+'</div><div class="routine-progress"><div class="bartrack"><div class="barfill" style="width:'+percent+'%"></div></div><small>'+done+' / '+items.length+' 완료 · '+percent+'%</small></div><button class="smallbtn" id="departSet">출발 시간 설정</button></section><div class="routine-note">'+esc(localStorage.getItem('family-memo')||'오늘도 우리 가족은 너를 응원해요.')+'</div><section class="routine-panel"><h2>오늘의 할 일</h2>'+(cards?'<div class="routine-grid">'+cards+'</div>':'<div class="routine-empty">아직 등록된 할 일이 없어요. 아래 버튼에서 추가해 주세요.</div>')+'<div class="routine-actions"><button class="primary" id="routineManage">할 일 추가·수정</button></div></section>';root.querySelectorAll('[data-routine]').forEach(b=>b.onclick=()=>{let t=data.tasks[+b.dataset.routine];t.done=!t.done;save();render();renderExtra()});document.getElementById('routineManage').onclick=()=>taskView(who);document.getElementById('departSet').onclick=()=>{show(who+' 출발 시간 설정','<form id="departForm" class="settings"><label>출발 시간 <input type="time" name="departure" value="'+esc(deadline)+'"></label><div class="actionrow"><button class="primary">저장</button><button class="smallbtn" type="button" id="clearDepart">설정 지우기</button></div></form>');document.getElementById('departForm').onsubmit=e=>{e.preventDefault();meta['depart_'+who]=e.currentTarget.elements.departure.value;save();$('modal').close();renderExtra()};document.getElementById('clearDepart').onclick=()=>{delete meta['depart_'+who];save();$('modal').close();renderExtra()}}}
$('modal').addEventListener('close',()=>{if(activeView!=='home')renderExtra()});
setInterval(()=>{if(activeView==='우양이'||activeView==='이안이'){let el=$('remaining'),val=meta['depart_'+activeView];if(el&&val){let [h,m]=val.split(':').map(Number),target=new Date();target.setHours(h,m,0,0);let mins=Math.ceil((target-Date.now())/60000);el.textContent=mins>0?mins+'분 남았어요':'출발 시간이 지났어요'}}},10000);
tick();render();weather();wake();setInterval(tick,1000);setInterval(weather,1800000);setInterval(()=>{if(document.visibilityState==='visible')checkUpdate(false)},300000);
</script></body></html>
