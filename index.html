<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="우리집 하루"><title>우리집 하루</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#25345a;background:#f3f6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(16px,2.4vw,36px);background:radial-gradient(circle at 5% 0%,#fff1c7,transparent 28%),radial-gradient(circle at 100% 100%,#f6d9ed,transparent 34%),#f2f6ff}main{max-width:1600px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:clamp(22px,2.3vw,36px)}.brand span{color:#ff9b60}.topnote{font-size:clamp(14px,1.3vw,19px);font-weight:700;color:#7181a2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border-radius:30px;padding:clamp(20px,2.5vw,38px);box-shadow:0 12px 35px #5069a414;min-width:0}.clockcard{background:#fff1d3;display:flex;flex-direction:column;justify-content:center;min-height:260px}.eyebrow{font-size:clamp(17px,1.6vw,24px);font-weight:800;color:#9a7749}.clock{font-size:clamp(70px,10vw,155px);line-height:1.05;letter-spacing:-.07em;font-weight:900;font-variant-numeric:tabular-nums}.date{font-size:clamp(24px,2.4vw,38px);font-weight:800;margin-top:10px}.weather{background:#e5f5ff}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading h2{margin:0;font-size:clamp(23px,2.2vw,34px)}.small{color:#7181a2;font-weight:700;font-size:clamp(13px,1.1vw,17px)}.weathergrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.forecast{background:#ffffffb8;border-radius:22px;padding:clamp(13px,1.6vw,24px)}.forecast .day{font-size:clamp(18px,1.8vw,27px);font-weight:900}.wx{font-size:clamp(36px,4vw,62px);line-height:1.2}.desc{font-size:clamp(18px,1.7vw,27px);font-weight:800}.temp{font-size:clamp(19px,2vw,31px);font-weight:900;margin-top:6px}.rain{font-size:clamp(14px,1.3vw,19px);color:#60769a;margin-top:4px}.todos{grid-column:1/-1;background:#fff}.todohead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.todohead h2{font-size:clamp(23px,2.2vw,34px);margin:0}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:18px 0}.item{display:flex;align-items:center;gap:12px;background:#f5f7ff;border-radius:17px;padding:10px 13px}.check{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;font-size:clamp(19px,1.8vw,27px);font-weight:750}.check input{width:27px;height:27px;accent-color:#6f70e8;flex:none}.check span{overflow-wrap:anywhere}.check input:checked+span{text-decoration:line-through;color:#9ba6bc}.del{border:0;background:transparent;color:#9aa6bd;font-size:25px;cursor:pointer;padding:6px 10px}.add{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;border:2px solid #e1e7f7;border-radius:15px;padding:13px 17px;font:inherit;font-size:18px}button.addbtn{border:0;background:#7775e9;color:white;border-radius:15px;padding:12px 23px;font:inherit;font-size:18px;font-weight:800;cursor:pointer}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:#7b8aa7}button.refresh{border:0;border-radius:12px;background:#d5edfb;color:#456789;font-weight:800;padding:8px 12px;cursor:pointer}#night{display:none;position:fixed;inset:0;background:#000;z-index:100}body.sleep #night{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.todos{grid-column:auto}.clockcard{min-height:190px}.list{grid-template-columns:1fr}.topnote{display:none}}@media(max-height:700px) and (min-width:701px){body{padding:14px 24px}.grid{gap:12px}.card{padding:18px 24px}.clockcard{min-height:185px}.clock{font-size:clamp(70px,9vw,120px)}.weathergrid{margin-top:8px}.list{margin:10px 0}.item{padding:6px 10px}header{margin-bottom:8px}}
</style></head><body><main><header><div class="brand">🏡 우리집 <span>하루</span></div><div class="topnote">오늘도 함께라서 좋아요 ✨</div></header><div class="grid"><section class="card clockcard"><div class="eyebrow">지금은</div><div class="clock" id="clock">--:--</div><div class="date" id="date">날짜를 불러오는 중</div></section><section class="card weather"><div class="heading"><h2>🌤️ 새롬동 날씨</h2><button class="refresh" id="refresh">새로고침</button></div><div class="weathergrid" id="weather"><div class="forecast">날씨를 불러오는 중이에요</div></div><div class="small" id="weatherStatus" style="margin-top:8px">날씨: Open-Meteo</div></section><section class="card todos"><div class="todohead"><h2>🌈 우리 가족 할 일</h2><div class="small" id="progress"></div></div><div class="list" id="list"></div><form class="add" id="form"><input id="newTask" type="text" maxlength="60" placeholder="새로운 할 일을 적어 주세요" aria-label="새 할 일" required><button class="addbtn">추가하기</button></form><div class="foot"><span>체크는 매일 아침 7시에 다시 풀려요 ☀️</span><span id="wake">화면 꺼짐 방지 확인 중</span></div></section></div></main><div id="night" aria-label="밤 시간 화면"></div><script>
const $=id=>document.getElementById(id),KEY='family-dashboard-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.tasks))data={tasks:[{text:'일어나서 인사하기',done:false},{text:'양치하기',done:false},{text:'내 물건 정리하기',done:false}],day:''};let storageOK=true;function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){storageOK=false;$('progress').textContent='저장할 수 없어요. 브라우저 저장 설정을 확인해 주세요.'}}function dayKey(d){let shifted=new Date(d.getTime()-7*3600000);return [shifted.getFullYear(),shifted.getMonth()+1,shifted.getDate()].join('-')}function reset(d){let day=dayKey(d);if(data.day!==day){if(data.day)data.tasks.forEach(t=>t.done=false);data.day=day;save();render()}}function render(){const list=$('list');list.replaceChildren();data.tasks.forEach((task,i)=>{let row=document.createElement('div');row.className='item';let label=document.createElement('label');label.className='check';let box=document.createElement('input');box.type='checkbox';box.checked=task.done;box.addEventListener('change',()=>{task.done=box.checked;save();render()});let name=document.createElement('span');name.textContent=task.text;label.append(box,name);let del=document.createElement('button');del.className='del';del.type='button';del.textContent='×';del.setAttribute('aria-label',task.text+' 삭제');del.addEventListener('click',()=>{if(confirm('이 할 일을 삭제할까요?')){data.tasks.splice(i,1);save();render()}});row.append(label,del);list.append(row)});if(storageOK)$('progress').textContent=`${data.tasks.filter(t=>t.done).length} / ${data.tasks.length} 완료`;}
$('form').addEventListener('submit',e=>{e.preventDefault();let text=$('newTask').value.trim();if(!text)return;data.tasks.push({text,done:false});$('newTask').value='';save();render()});function tick(){const d=new Date();$('clock').textContent=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);$('date').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);document.body.classList.toggle('sleep',d.getHours()>=22||d.getHours()<7);reset(d)}
function condition(c){if(c===0)return ['☀️','맑음'];if(c<=3)return ['⛅','구름 조금'];if(c<=48)return ['🌫️','안개'];if(c<=57)return ['🌦️','이슬비'];if(c<=67)return ['🌧️','비'];if(c<=77)return ['❄️','눈'];if(c<=82)return ['🌦️','소나기'];if(c<=86)return ['🌨️','눈 소나기'];if(c>=95)return ['⛈️','천둥번개'];return ['🌤️','날씨 확인']};let lastWeather='';async function weather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=36.48&longitude=127.25&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2';let response=await fetch(url);if(!response.ok)throw Error();let json=await response.json(),w=json.daily;if(!w||!w.time||w.time.length<2)throw Error();let root=$('weather');root.replaceChildren();for(let i=0;i<2;i++){let [icon,desc]=condition(w.weather_code[i]);let box=document.createElement('div');box.className='forecast';let chance=w.precipitation_probability_max[i];box.innerHTML=`<div class="day">${i?'내일':'오늘'}</div><div class="wx">${icon}</div><div class="desc">${desc}</div><div class="temp">${Math.round(w.temperature_2m_min[i])}° / ${Math.round(w.temperature_2m_max[i])}°</div><div class="rain">강수 확률 ${chance==null?'—':Math.round(chance)+'%'}</div>`;root.append(box)}lastWeather=new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});$('weatherStatus').textContent='Open-Meteo · '+lastWeather+' 업데이트'}catch(e){$('weatherStatus').textContent=lastWeather?'날씨 연결 실패 · 마지막 업데이트 '+lastWeather:'날씨를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}}
$('refresh').addEventListener('click',weather);let lock=null;async function wake(){if(!('wakeLock'in navigator)){$('wake').textContent='화면 꺼짐 방지 미지원';return}try{lock=await navigator.wakeLock.request('screen');$('wake').textContent='화면 꺼짐 방지 켜짐';lock.addEventListener('release',()=>{$('wake').textContent='화면 꺼짐 방지 해제됨'})}catch(e){$('wake').textContent='화면 꺼짐 방지 불가 · 화면을 터치해 보세요'}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();wake();weather()}});document.addEventListener('pointerdown',()=>{if(!lock||lock.released)wake()});
// An embedded manifest keeps the deliverable in a single HTML file. Browser support for blob manifests varies.
if(location.protocol.startsWith('http')){let manifest={name:'우리집 하루',short_name:'우리집 하루',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f3f6ff',theme_color:'#f3f6ff'};let link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));document.head.append(link)}tick();render();weather();wake();setInterval(tick,1000);setInterval(weather,30*60*1000);
</script></body></html>
