<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f8ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="우리집 하루"><title>우리집 하루</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#25345a;background:#f3f6ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:clamp(16px,2.4vw,36px);background:radial-gradient(circle at 5% 0%,#fff1c7,transparent 28%),radial-gradient(circle at 100% 100%,#f6d9ed,transparent 34%),#f2f6ff}main{max-width:1600px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:900;font-size:clamp(22px,2.3vw,36px)}.brand span{color:#ff9b60}.topnote{font-size:clamp(14px,1.3vw,19px);font-weight:700;color:#7181a2}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border-radius:30px;padding:clamp(20px,2.5vw,38px);box-shadow:0 12px 35px #5069a414;min-width:0}.clockcard{background:#fff1d3;display:flex;flex-direction:column;justify-content:center;min-height:260px}.eyebrow{font-size:clamp(17px,1.6vw,24px);font-weight:800;color:#9a7749}.clock{font-size:clamp(70px,10vw,155px);line-height:1.05;letter-spacing:-.07em;font-weight:900;font-variant-numeric:tabular-nums}.date{font-size:clamp(24px,2.4vw,38px);font-weight:800;margin-top:10px}.weather{background:#e5f5ff}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading h2{margin:0;font-size:clamp(23px,2.2vw,34px)}.small{color:#7181a2;font-weight:700;font-size:clamp(13px,1.1vw,17px)}.weathergrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.forecast{background:#ffffffb8;border-radius:22px;padding:clamp(13px,1.6vw,24px)}.forecast .day{font-size:clamp(18px,1.8vw,27px);font-weight:900}.wx{font-size:clamp(36px,4vw,62px);line-height:1.2}.desc{font-size:clamp(18px,1.7vw,27px);font-weight:800}.temp{font-size:clamp(19px,2vw,31px);font-weight:900;margin-top:6px}.rain{font-size:clamp(14px,1.3vw,19px);color:#60769a;margin-top:4px}.todos{grid-column:1/-1;background:#fff}.todohead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.todohead h2{font-size:clamp(23px,2.2vw,34px);margin:0}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:18px 0}.item{display:flex;align-items:center;gap:12px;background:#f5f7ff;border-radius:17px;padding:10px 13px}.check{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;font-size:clamp(19px,1.8vw,27px);font-weight:750}.check input{width:27px;height:27px;accent-color:#6f70e8;flex:none}.check span{overflow-wrap:anywhere}.check input:checked+span{text-decoration:line-through;color:#9ba6bc}.del{border:0;background:transparent;color:#9aa6bd;font-size:25px;cursor:pointer;padding:6px 10px}.add{display:flex;gap:10px}input[type=text]{min-width:0;flex:1;border:2px solid #e1e7f7;border-radius:15px;padding:13px 17px;font:inherit;font-size:18px}button.addbtn{border:0;background:#7775e9;color:white;border-radius:15px;padding:12px 23px;font:inherit;font-size:18px;font-weight:800;cursor:pointer}.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:14px;color:#7b8aa7}button.refresh{border:0;border-radius:12px;background:#d5edfb;color:#456789;font-weight:800;padding:8px 12px;cursor:pointer}#night{display:none;position:fixed;inset:0;background:#000;z-index:100}body.sleep #night{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.todos{grid-column:auto}.clockcard{min-height:190px}.list{grid-template-columns:1fr}.topnote{display:none}}@media(max-height:700px) and (min-width:701px){body{padding:14px 24px}.grid{gap:12px}.card{padding:18px 24px}.clockcard{min-height:185px}.clock{font-size:clamp(70px,9vw,120px)}.weathergrid{margin-top:8px}.list{margin:10px 0}.item{padding:6px 10px}header{margin-bottom:8px}}
 .ic{width:1.35em;height:1.35em;vertical-align:-.3em;display:inline-block;flex:none}.village .ic{width:2em;height:2em}.brand .ic{width:1.6em;height:1.6em} .village{background:#e6f8df;border-radius:20px;padding:12px 18px;margin-top:15px;font-size:clamp(25px,3vw,42px)}.village span:last-child{font-size:16px;color:#607b63}.familytabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.familytabs button,.tools button{border:0;border-radius:14px;padding:11px 16px;background:#ebefff;font:inherit;font-weight:800;color:#45567d;cursor:pointer}.familytabs button.active{background:#7775e9;color:white}select{font:inherit;font-size:16px;border:2px solid #e1e7f7;border-radius:14px;background:white;padding:8px}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.tools input{max-width:100%}dialog{border:0;border-radius:24px;max-width:min(90vw,600px);padding:25px;color:#25345a}dialog::backdrop{background:#17214199}@media(max-width:700px){.add{flex-wrap:wrap}.add input{flex-basis:100%}} </style></head><body><svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0" aria-hidden="true"><symbol id="i-home" viewBox="0 0 48 48"><path fill="#fa9d7f" d="M3 22 24 5l21 17-3 3-4-3v20H10V22l-4 3z"/><path fill="#fff4dc" d="M13 21 24 12l11 9v18H13z"/><path fill="#809ce3" d="M20 27h8v12h-8z"/></symbol><symbol id="i-sun" viewBox="0 0 48 48"><circle cx="24" cy="24" r="11" fill="#ffca62"/><path d="M24 3v6M24 39v6M3 24h6M39 24h6M9 9l4 4m22 22 4 4M39 9l-4 4M13 35l-4 4" stroke="#f4a94c" stroke-width="3" stroke-linecap="round"/></symbol><symbol id="i-cloud" viewBox="0 0 48 48"><path fill="#a9cdec" d="M12 36a9 9 0 0 1-1-18 13 13 0 0 1 25 3 8 8 0 0 1-1 15z"/></symbol><symbol id="i-rain" viewBox="0 0 48 48"><path fill="#a9cdec" d="M11 28a8 8 0 0 1 0-16 12 12 0 0 1 23 3 7 7 0 0 1 0 13z"/><path d="m15 33-2 5m11-5-2 5m11-5-2 5" stroke="#608cc7" stroke-width="3" stroke-linecap="round"/></symbol><symbol id="i-snow" viewBox="0 0 48 48"><path d="M24 5v38M8 14l32 20M40 14 8 34" fill="none" stroke="#8cb8d9" stroke-width="4" stroke-linecap="round"/></symbol><symbol id="i-bear" viewBox="0 0 48 48"><circle cx="12" cy="12" r="8" fill="#cb9871"/><circle cx="36" cy="12" r="8" fill="#cb9871"/><circle cx="24" cy="25" r="20" fill="#dfb18a"/><ellipse cx="24" cy="30" rx="9" ry="7" fill="#f8e7d4"/><circle cx="17" cy="23" r="2" fill="#55473f"/><circle cx="31" cy="23" r="2" fill="#55473f"/><circle cx="24" cy="28" r="2" fill="#55473f"/></symbol><symbol id="i-rabbit" viewBox="0 0 48 48"><ellipse cx="15" cy="13" rx="6" ry="12" fill="#e5d4e9"/><ellipse cx="33" cy="13" rx="6" ry="12" fill="#e5d4e9"/><circle cx="24" cy="29" r="18" fill="#f4e7f5"/><circle cx="17" cy="28" r="2" fill="#5b4b62"/><circle cx="31" cy="28" r="2" fill="#5b4b62"/><path d="M22 33q2 3 4 0" fill="none" stroke="#bd8099" stroke-width="2" stroke-linecap="round"/></symbol><symbol id="i-flower" viewBox="0 0 48 48"><path d="M24 24v20m0-8q-8-1-9-7m9 10q7-2 9-8" fill="none" stroke="#68a77d" stroke-width="3" stroke-linecap="round"/><g fill="#f7aab7"><circle cx="24" cy="10" r="6"/><circle cx="17" cy="17" r="6"/><circle cx="31" cy="17" r="6"/><circle cx="20" cy="23" r="6"/><circle cx="28" cy="23" r="6"/></g><circle cx="24" cy="17" r="4" fill="#ffda73"/></symbol></svg><main><header><div class="brand"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg> 우리 가족의 <span>작은 마을</span></div><div class="topnote">오늘도 함께라서 좋아요</div></header><div class="grid"><section class="card clockcard"><div class="eyebrow">지금은</div><div class="clock" id="clock">--:--</div><div class="date" id="date">날짜를 불러오는 중</div></section><section class="card weather"><div class="heading"><h2><svg class="ic" aria-hidden="true"><use href="#i-sun"></use></svg> 새롬동 날씨</h2><button class="refresh" id="refresh">새로고침</button></div><div class="weathergrid" id="weather"><div class="forecast">날씨를 불러오는 중이에요</div></div><div class="small" id="weatherStatus" style="margin-top:8px">날씨: Open-Meteo</div></section><section class="card todos"><div class="todohead"><h2>우리 가족 할 일</h2><div class="small" id="progress"></div></div><div class="village"><svg class="ic" aria-hidden="true"><use href="#i-flower"></use></svg> <svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg> <svg class="ic" aria-hidden="true"><use href="#i-flower"></use></svg> <span id="garden"><svg class="ic" aria-hidden="true"><use href="#i-flower"></use></svg></span> <span id="gardenCount"></span></div><nav class="familytabs" aria-label="가족 선택"><button type="button" data-family="전체">모두</button><button type="button" data-family="우양이"><svg class="ic" aria-hidden="true"><use href="#i-bear"></use></svg> 우양이</button><button type="button" data-family="이안이"><svg class="ic" aria-hidden="true"><use href="#i-rabbit"></use></svg> 이안이</button><button type="button" data-family="가족"><svg class="ic" aria-hidden="true"><use href="#i-home"></use></svg> 가족</button></nav><div class="list" id="list"></div><form class="add" id="form"><select id="owner" aria-label="담당자"><option>가족</option><option>우양이</option><option>이안이</option></select><select id="repeat" aria-label="반복"><option value="daily">매일</option><option value="weekdays">평일</option><option value="weekends">주말</option><option value="once">한 번만</option></select><input id="newTask" type="text" maxlength="60" placeholder="새로운 할 일을 적어 주세요" aria-label="새 할 일" required><button class="addbtn">추가하기</button></form><div class="tools"><button type="button" id="nightToggle">야간 화면 켜기</button><button type="button" id="timerBtn">타이머</button><button type="button" id="noteBtn">가족 메모</button><button type="button" id="backupBtn">백업</button><button type="button" id="restoreBtn">복원</button><input type="file" id="restoreFile" accept="application/json" hidden></div><div class="foot"><span>체크는 매일 아침 7시에 다시 풀려요</span><span id="wake">화면 꺼짐 방지 확인 중</span></div></section></div></main><dialog id="modal"><div id="modalBody"></div><p><button id="closeModal">닫기</button></p></dialog><div id="night" aria-label="밤 시간 화면"></div><script>
const $=id=>document.getElementById(id),KEY='family-dashboard-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.tasks))data={tasks:[{text:'일어나서 인사하기',done:false},{text:'양치하기',done:false},{text:'내 물건 정리하기',done:false}],day:''};let selectedFamily='전체';let storageOK=true;function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){storageOK=false;$('progress').textContent='저장할 수 없어요. 브라우저 저장 설정을 확인해 주세요.'}}function dayKey(d){let shifted=new Date(d.getTime()-7*3600000);return [shifted.getFullYear(),shifted.getMonth()+1,shifted.getDate()].join('-')}function reset(d){let day=dayKey(d);if(data.day!==day){if(data.day)data.tasks.forEach(t=>{if(t.repeat!=='once')t.done=false});data.day=day;save();render()}}function render(){const list=$('list');list.replaceChildren();data.tasks.forEach((task,i)=>{let dow=new Date().getDay();if((task.repeat==='weekdays'&&(dow===0||dow===6))||(task.repeat==='weekends'&&dow>0&&dow<6)||(selectedFamily!=='전체'&&(task.owner||'가족')!==selectedFamily))return;let row=document.createElement('div');row.className='item';let label=document.createElement('label');label.className='check';let box=document.createElement('input');box.type='checkbox';box.checked=task.done;box.addEventListener('change',()=>{task.done=box.checked;save();render()});let name=document.createElement('span');name.textContent=(task.owner||'가족')+' · '+task.text;label.append(box,name);let del=document.createElement('button');del.className='del';del.type='button';del.textContent='×';del.setAttribute('aria-label',task.text+' 삭제');del.addEventListener('click',()=>{if(confirm('이 할 일을 삭제할까요?')){data.tasks.splice(i,1);save();render()}});row.append(label,del);list.append(row)});$('gardenCount').textContent='오늘 함께 해낸 일 '+data.tasks.filter(t=>t.done).length+'개';$('garden').innerHTML=Array.from({length:Math.min(4,data.tasks.filter(t=>t.done).length+1)},()=>'<svg class="ic" aria-hidden="true"><use href="#i-flower"></use></svg>').join('');if(storageOK)$('progress').textContent=`${data.tasks.filter(t=>t.done).length} / ${data.tasks.length} 완료`;}
$('form').addEventListener('submit',e=>{e.preventDefault();let text=$('newTask').value.trim();if(!text)return;data.tasks.push({text,done:false,owner:$('owner').value,repeat:$('repeat').value});$('newTask').value='';save();render()});let nightUntil=0;function tick(){const d=new Date();$('clock').textContent=new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false}).format(d);$('date').textContent=new Intl.DateTimeFormat('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(d);document.body.classList.toggle('sleep',localStorage.getItem('family-night-enabled')==='true'&&(d.getHours()>=22||d.getHours()<7)&&Date.now()>nightUntil);reset(d)}
function condition(c){if(c===0)return ['sun','맑음'];if(c<=3)return ['cloud','구름 조금'];if(c<=48)return ['cloud','안개'];if(c<=57)return ['rain','이슬비'];if(c<=67)return ['rain','비'];if(c<=77)return ['snow','눈'];if(c<=82)return ['rain','소나기'];if(c<=86)return ['snow','눈 소나기'];if(c>=95)return ['rain','천둥번개'];return ['cloud','날씨 확인']};let lastWeather='';async function weather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=36.48&longitude=127.25&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FSeoul&forecast_days=2';let response=await fetch(url);if(!response.ok)throw Error();let json=await response.json(),w=json.daily;if(!w||!w.time||w.time.length<2)throw Error();let root=$('weather');root.replaceChildren();for(let i=0;i<2;i++){let [icon,desc]=condition(w.weather_code[i]);let box=document.createElement('div');box.className='forecast';let chance=w.precipitation_probability_max[i];box.innerHTML=`<div class="day">${i?'내일':'오늘'}</div><div class="wx"><svg class="ic" aria-hidden="true"><use href="#i-${icon}"></use></svg></div><div class="desc">${desc}</div><div class="temp">${Math.round(w.temperature_2m_min[i])}° / ${Math.round(w.temperature_2m_max[i])}°</div><div class="rain">강수 확률 ${chance==null?'—':Math.round(chance)+'%'}</div>`;root.append(box)}lastWeather=new Date().toLocaleTimeString('ko-KR',{hour:'numeric',minute:'2-digit'});$('weatherStatus').textContent='Open-Meteo · '+lastWeather+' 업데이트'}catch(e){$('weatherStatus').textContent=lastWeather?'날씨 연결 실패 · 마지막 업데이트 '+lastWeather:'날씨를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.'}}
$('refresh').addEventListener('click',weather);let lock=null;async function wake(){if(!('wakeLock'in navigator)){$('wake').textContent='화면 꺼짐 방지 미지원';return}try{lock=await navigator.wakeLock.request('screen');$('wake').textContent='화면 꺼짐 방지 켜짐';lock.addEventListener('release',()=>{$('wake').textContent='화면 꺼짐 방지 해제됨'})}catch(e){$('wake').textContent='화면 꺼짐 방지 불가 · 화면을 터치해 보세요'}}document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){tick();wake();weather()}});document.addEventListener('pointerdown',()=>{if(!lock||lock.released)wake()});
// An embedded manifest keeps the deliverable in a single HTML file. Browser support for blob manifests varies.
if(location.protocol.startsWith('http')){let manifest={name:'우리집 하루',short_name:'우리집 하루',start_url:location.href.split('#')[0],display:'standalone',background_color:'#f3f6ff',theme_color:'#f3f6ff'};let link=document.createElement('link');link.rel='manifest';link.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));document.head.append(link)}
document.querySelectorAll('.familytabs button').forEach(b=>b.addEventListener('click',()=>{selectedFamily=b.dataset.family;document.querySelectorAll('.familytabs button').forEach(x=>x.classList.toggle('active',x===b));render()}));document.querySelector('.familytabs button').classList.add('active');
function modal(html){$('modalBody').innerHTML=html;$('modal').showModal()}$('closeModal').onclick=()=>$('modal').close();
$('noteBtn').onclick=()=>{modal('<h2>우리 가족 메모</h2><textarea id="memo" rows="5" style="width:100%;font:inherit;font-size:20px" placeholder="가족에게 전하고 싶은 말을 적어 주세요"></textarea><button id="saveMemo">저장</button>');$('memo').value=localStorage.getItem('family-memo')||'';$('saveMemo').onclick=()=>{localStorage.setItem('family-memo',$('memo').value);$('modal').close()}};
let timerEnd=0,timerInterval;$('timerBtn').onclick=()=>{modal('<h2>함께 타이머</h2><p id="timerDisplay" style="font-size:48px">00:00</p><button data-min="3">양치 3분</button> <button data-min="5">정리 5분</button> <button data-min="10">독서 10분</button> <button id="timerStop">멈춤</button>');function update(){let n=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));if($('timerDisplay'))$('timerDisplay').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');if(!n&&timerEnd){timerEnd=0;clearInterval(timerInterval);if($('timerDisplay'))$('timerDisplay').textContent='시간 끝!'}}document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{timerEnd=Date.now()+Number(b.dataset.min)*60000;clearInterval(timerInterval);update();timerInterval=setInterval(update,250)});$('timerStop').onclick=()=>{timerEnd=0;clearInterval(timerInterval);$('timerDisplay').textContent='00:00'};if(timerEnd)update()};
$('backupBtn').onclick=()=>{let b=new Blob([JSON.stringify({version:1,data,memo:localStorage.getItem('family-memo')||''},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='family-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restoreBtn').onclick=()=>$('restoreFile').click();$('restoreFile').onchange=async e=>{try{let parsed=JSON.parse(await e.target.files[0].text());if(!parsed.data||!Array.isArray(parsed.data.tasks)||!parsed.data.tasks.every(t=>typeof t.text==='string'&&typeof t.done==='boolean'))throw Error();if(confirm('현재 할 일과 메모를 백업 내용으로 바꿀까요?')){data=parsed.data;localStorage.setItem('family-memo',String(parsed.memo||''));save();tick();render()}}catch(e){alert('올바른 백업 파일이 아니에요.')}e.target.value=''};
function nightLabel(){$('nightToggle').textContent=localStorage.getItem('family-night-enabled')==='true'?'야간 화면 끄기':'야간 화면 켜기'}$('nightToggle').onclick=()=>{let enabled=localStorage.getItem('family-night-enabled')!=='true';localStorage.setItem('family-night-enabled',String(enabled));nightLabel();if(enabled){nightUntil=Date.now()+30000;alert('야간 화면을 켰어요. 밤 10시 이후에는 30초 뒤 화면이 검게 바뀝니다. 검은 화면을 1.5초 길게 누르면 다시 볼 수 있어요.')}tick()};nightLabel();
let hold;$('night').addEventListener('pointerdown',()=>{hold=setTimeout(()=>{nightUntil=Date.now()+30000;document.body.classList.remove('sleep')},1500)});['pointerup','pointercancel','pointerleave'].forEach(e=>$('night').addEventListener(e,()=>clearTimeout(hold)));
tick();render();weather();wake();setInterval(tick,1000);setInterval(weather,30*60*1000);
</script></body></html>
